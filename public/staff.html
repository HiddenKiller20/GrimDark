<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal | The Grimdark Imperium</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/"><img src="/tgi-official-logo.webp?v=2" alt="TGI logo"><b>THE GRIMDARK IMPERIUM</b></a><nav><a href="/">Home</a><a href="/report.html">Submit Evidence</a></nav></header>
<main><section class="form-page"><small>AUTHORIZED PERSONNEL ONLY</small><h1>Staff Portal</h1>
<div id="loginPanel" class="staff-login"><form id="loginForm"><label>Staff password<input id="staffPassword" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">SIGN IN</button><div id="loginMsg" class="form-msg"></div></form></div>
<div id="staffPanel" hidden><div class="staff-toolbar"><button class="btn alt" id="refreshBtn">REFRESH</button><button class="btn" id="logoutBtn">SIGN OUT</button></div><div id="submissionList" class="submission-list"></div></div>
</section></main>
<script>
const loginPanel=document.getElementById('loginPanel'),staffPanel=document.getElementById('staffPanel'),list=document.getElementById('submissionList');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function check(){const r=await fetch('/api/staff/session');const j=await r.json();loginPanel.hidden=j.authenticated;staffPanel.hidden=!j.authenticated;if(j.authenticated)load()}
async function load(){list.innerHTML='<p>Loading submissions…</p>';const r=await fetch('/api/staff/submissions');if(!r.ok){staffPanel.hidden=true;loginPanel.hidden=false;return}const rows=await r.json();if(!rows.length){list.innerHTML='<div class="order-card"><p>No evidence submissions yet.</p></div>';return}list.innerHTML=rows.map(x=>`<article class="submission-card"><div class="submission-head"><div><small>CASE ${esc(x.id)}</small><h3>${esc(x.reportedUser)}</h3></div><select data-id="${esc(x.id)}"><option ${x.status==='Pending Review'?'selected':''}>Pending Review</option><option ${x.status==='Under Review'?'selected':''}>Under Review</option><option ${x.status==='Action Taken'?'selected':''}>Action Taken</option><option ${x.status==='Dismissed'?'selected':''}>Dismissed</option><option ${x.status==='Archived'?'selected':''}>Archived</option></select></div><p><b>Reporter:</b> ${esc(x.reporter)}</p><p><b>Incident date:</b> ${esc(x.incidentDate||'Not provided')}</p><p><b>Reason:</b> ${esc(x.reason)}</p><p><b>Details:</b><br>${esc(x.details).replace(/\n/g,'<br>')}</p>${x.evidenceLinks?`<p><b>Evidence links:</b><br><span class="mono">${esc(x.evidenceLinks).replace(/\n/g,'<br>')}</span></p>`:''}${(x.files||[]).length?`<p><b>Attachments:</b> ${x.files.map(f=>`<a class="file-link" href="/api/staff/files/${encodeURIComponent(x.id)}/${encodeURIComponent(f.stored)}">${esc(f.original)}</a>`).join(' ')}</p>`:''}<p class="case-date">Submitted ${new Date(x.createdAt).toLocaleString()}</p></article>`).join('');document.querySelectorAll('.submission-card select').forEach(s=>s.onchange=()=>updateStatus(s.dataset.id,s.value))}
async function updateStatus(id,status){const r=await fetch('/api/staff/submissions/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert('Could not update status')}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='Signing in…';const r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('staffPassword').value})});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Sign-in failed';return}msg.textContent='';check()};
document.getElementById('refreshBtn').onclick=load;document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/staff/logout',{method:'POST'});check()};check();
</script></body></html>
