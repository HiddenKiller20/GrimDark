<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Portal | The Grimdark Imperium</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/"><img src="/1000002991.png.png?v=3" alt="TGI logo"></a><nav><a href="/">Home</a><a href="/report.html">Submit Evidence</a></nav></header>
<main><section class="form-page staff-page"><small>AUTHORIZED PERSONNEL ONLY</small><h1>Staff Portal</h1>
<div id="loginPanel" class="staff-login"><form id="loginForm"><label>Staff password<input id="staffPassword" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">SIGN IN</button><div id="loginMsg" class="form-msg"></div></form></div>
<div id="staffPanel" hidden>
<div class="admin-tabs"><button data-tab="reports" class="active">EVIDENCE REPORTS</button><button data-tab="blacklist">BLACKLIST</button><button data-tab="offenses">OFFENSES</button><button data-tab="content">ORDER TEXT</button></div>
<div class="staff-toolbar"><button class="btn alt" id="refreshBtn">REFRESH</button><button class="btn" id="logoutBtn">SIGN OUT</button></div>
<div id="adminView"></div></div></section></main>
<script>
const loginPanel=document.getElementById('loginPanel'),staffPanel=document.getElementById('staffPanel'),view=document.getElementById('adminView');let currentTab='reports';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function check(){const j=await api('/api/staff/session');loginPanel.hidden=j.authenticated;staffPanel.hidden=!j.authenticated;if(j.authenticated)load()}
function field(label,name,value='',type='input'){return '<label>'+label+(type==='textarea'?'<textarea name="'+name+'" rows="5">'+esc(value)+'</textarea>':'<input name="'+name+'" value="'+esc(value)+'">')+'</label>'}
async function load(){view.innerHTML='<p>Loading…</p>';try{if(currentTab==='reports')await loadReports();if(currentTab==='blacklist')await loadBlacklist();if(currentTab==='offenses')await loadOffenses();if(currentTab==='content')await loadContent()}catch(e){view.innerHTML='<div class="form-msg">'+esc(e.message)+'</div>'}}
async function loadReports(){const rows=await api('/api/staff/submissions');view.innerHTML='<div class="admin-section-head"><h2>Evidence Reports</h2><p>Edit every report field, status, or delete a report.</p></div>'+(rows.length?rows.map(x=>`<form class="submission-card admin-form" data-report="${esc(x.id)}"><div class="submission-head"><div><small>CASE ${esc(x.id)}</small><h3>${esc(x.reportedUser)}</h3></div><select name="status">${['Pending Review','Under Review','Action Taken','Dismissed','Archived'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div>${field('Reported username','reportedUser',x.reportedUser)}${field('Reporter','reporter',x.reporter)}${field('Incident date','incidentDate',x.incidentDate)}${field('Reason','reason',x.reason,'textarea')}${field('Details','details',x.details,'textarea')}${field('Evidence links','evidenceLinks',x.evidenceLinks,'textarea')}${(x.files||[]).length?'<p><b>Attachments:</b> '+x.files.map(f=>`<a class="file-link" href="/api/staff/files/${encodeURIComponent(x.id)}/${encodeURIComponent(f.stored)}">${esc(f.original)}</a>`).join(' ')+'</p>':''}<div class="admin-actions"><button class="btn" type="submit">SAVE REPORT</button><button class="btn danger" type="button" data-delete-report="${esc(x.id)}">DELETE</button></div></form>`).join(''):'<div class="order-card">No evidence submissions yet.</div>');document.querySelectorAll('[data-report]').forEach(f=>f.onsubmit=saveReport);document.querySelectorAll('[data-delete-report]').forEach(b=>b.onclick=()=>deleteReport(b.dataset.deleteReport))}
async function saveReport(e){e.preventDefault();const f=e.currentTarget,id=f.dataset.report,data=Object.fromEntries(new FormData(f));await api('/api/staff/submissions/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});alert('Report saved')}
async function deleteReport(id){if(!confirm('Delete this report permanently?'))return;await api('/api/staff/submissions/'+encodeURIComponent(id),{method:'DELETE'});load()}
async function loadBlacklist(){const rows=await api('/api/staff/blacklist');view.innerHTML=`<div class="admin-section-head"><h2>Blacklist Records</h2><p>Add, edit, archive, revoke, or delete Order of the Hammer records.</p></div><form id="newBlacklist" class="submission-card admin-form"><h3>Add Blacklist Record</h3>${field('Name','name')}${field('Reason','reason','','textarea')}${field('Offense / rule','offense','','textarea')}<label>Status<select name="status"><option>Active</option><option>Revoked</option><option>Expired</option><option>Archived</option></select></label>${field('Public summary','publicSummary','','textarea')}${field('Private staff notes','privateNotes','','textarea')}<button class="btn" type="submit">ADD RECORD</button></form><div class="submission-list">`+rows.map(x=>`<form class="submission-card admin-form" data-blacklist="${esc(x.id)}"><small>${esc(x.id)}</small><h3>${esc(x.name)}</h3>${field('Name','name',x.name)}${field('Reason','reason',x.reason,'textarea')}${field('Offense / rule','offense',x.offense,'textarea')}<label>Status<select name="status">${['Active','Revoked','Expired','Archived'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label>${field('Public summary','publicSummary',x.publicSummary,'textarea')}${field('Private staff notes','privateNotes',x.privateNotes,'textarea')}<div class="admin-actions"><button class="btn" type="submit">SAVE RECORD</button><button class="btn danger" type="button" data-delete-blacklist="${esc(x.id)}">DELETE</button></div></form>`).join('')+'</div>';document.getElementById('newBlacklist').onsubmit=addBlacklist;document.querySelectorAll('[data-blacklist]').forEach(f=>f.onsubmit=saveBlacklist);document.querySelectorAll('[data-delete-blacklist]').forEach(b=>b.onclick=()=>deleteBlacklist(b.dataset.deleteBlacklist))}
async function addBlacklist(e){e.preventDefault();await api('/api/staff/blacklist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});load()}
async function saveBlacklist(e){e.preventDefault();const f=e.currentTarget;await api('/api/staff/blacklist/'+encodeURIComponent(f.dataset.blacklist),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});alert('Blacklist record saved')}
async function deleteBlacklist(id){if(!confirm('Delete this blacklist record permanently?'))return;await api('/api/staff/blacklist/'+encodeURIComponent(id),{method:'DELETE'});load()}
async function loadOffenses(){const o=await api('/api/offenses');view.innerHTML=`<div class="admin-section-head"><h2>Offense Editor</h2><p>Add, remove, rewrite, or reorder any Order of the Hammer offense. Use one offense per line.</p></div><form id="offenseForm" class="submission-card admin-form">${field('Blacklist heading','blacklistTitle',o.blacklistTitle)}${field('Blacklist introduction','blacklistIntro',o.blacklistIntro,'textarea')}<label>Blacklistable offenses<textarea name="blacklistRules" rows="18">${esc(o.blacklistRules.join('\n'))}</textarea></label>${field('Info offenses heading','infoTitle',o.infoTitle)}${field('Info offenses introduction','infoIntro',o.infoIntro,'textarea')}<label>Info offenses<textarea name="infoRules" rows="10">${esc(o.infoRules.join('\n'))}</textarea></label><button class="btn" type="submit">SAVE OFFENSES</button></form>`;document.getElementById('offenseForm').onsubmit=saveOffenses}
async function saveOffenses(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));d.blacklistRules=d.blacklistRules.split('\n').map(x=>x.trim()).filter(Boolean);d.infoRules=d.infoRules.split('\n').map(x=>x.trim()).filter(Boolean);await api('/api/staff/offenses',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});alert('Offenses saved')}
async function loadContent(){const c=await api('/api/order-content');view.innerHTML=`<div class="admin-section-head"><h2>Order of the Hammer Text</h2><p>Edit the public Order title, description, and motto.</p></div><form id="contentForm" class="submission-card admin-form">${field('Title','title',c.title)}${field('Description','description',c.description,'textarea')}${field('Motto','motto',c.motto)}<button class="btn" type="submit">SAVE PUBLIC TEXT</button></form>`;document.getElementById('contentForm').onsubmit=async e=>{e.preventDefault();await api('/api/staff/order-content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});alert('Order text saved')}}
document.querySelectorAll('.admin-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;load()});
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='Signing in…';try{await api('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('staffPassword').value})});msg.textContent='';check()}catch(err){msg.textContent=err.message}};
document.getElementById('refreshBtn').onclick=load;document.getElementById('logoutBtn').onclick=async()=>{await api('/api/staff/logout',{method:'POST'});check()};check();
</script></body></html>
